# VisionQC — Docker Compose (Monitoring Stack)
# Prometheus + Grafana for API monitoring.
#
# Usage (from WSL, in the project directory):
#   docker compose -f docker-compose.monitoring.yml up -d
#   docker compose -f docker-compose.monitoring.yml logs -f
#   docker compose -f docker-compose.monitoring.yml down
#
# Services:
#   - Prometheus: http://localhost:9090
#   - Grafana:    http://localhost:3000  (admin / admin)
#
# Requires the VisionQC API to be running (docker-compose.yml or locally).
# The API service is referenced via the shared 'visionqc-net' network.

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: visionqc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - visionqc-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: visionqc-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - visionqc-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"

networks:
  visionqc-net:
    name: visionqc-net
    external: true

volumes:
  prometheus-data:
    name: visionqc-prometheus-data
  grafana-data:
    name: visionqc-grafana-data

