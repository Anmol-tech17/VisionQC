# VisionQC — Continuous Integration
# Runs on every push to main and on pull requests targeting main.
# All jobs use CPU-only PyTorch to keep runners lightweight.

name: CI — Tests & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Test suite
  # ──────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    name: Tests (Python 3.12)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          pip install prometheus-client>=0.21.0

      - name: Validate Python imports
        run: |
          python -c "from src.visionqc.api.main import app; print('✅ FastAPI app import OK')"
          python -c "from src.visionqc.inference.predictor import Detection; print('✅ Detection import OK')"
          python -c "from configs.settings import YOLO_CLASS_NAMES; print('✅ Settings import OK')"

      - name: Validate YAML configs
        run: |
          python -c "import yaml; yaml.safe_load(open('configs/training.yaml'));          print('✅ training.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('configs/training_exp_1.yaml'));    print('✅ training_exp_1.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('configs/training_exp_2.yaml'));    print('✅ training_exp_2.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('configs/training_exp_3.yaml'));    print('✅ training_exp_3.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('configs/training_exp_a.yaml'));    print('✅ training_exp_a.yaml OK')"
          python -c "import yaml; yaml.safe_load(open('configs/training_exp_b.yaml'));    print('✅ training_exp_b.yaml OK')"

      - name: Run CI-safe test suite
        run: python -m pytest tests/test_ci.py -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Lint — quick syntax checks
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    name: Lint (syntax check)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax with py_compile
        run: |
          echo "Checking Python source files for syntax errors..."
          python -m py_compile src/visionqc/api/main.py
          python -m py_compile src/visionqc/inference/predictor.py
          python -m py_compile src/visionqc/inference/visualizer.py
          python -m py_compile src/visionqc/inference/model_loader.py
          python -m py_compile configs/settings.py
          python -m py_compile tests/test_ci.py
          echo "✅ All source files have valid Python syntax."
